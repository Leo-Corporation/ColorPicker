name: Auto Release

# Builds the single-file Windows exe on every push to main and publishes it
# to a rolling "latest" GitHub Release (the previous one is replaced each run).
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.x

            - name: Read project version
              id: info
              shell: pwsh
              run: |
                  [xml]$xml = Get-Content "ColorPicker/ColorPicker.csproj"
                  $base = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
                  $sha = "${{ github.sha }}".Substring(0, 7)
                  "version=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "full=$base+$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            # Framework-dependent single-file build (~9.4 MB), matching upstream release size.
            # Requires the .NET 10 Desktop Runtime to be installed on the target machine.
            # NOTE: must use the -p:SelfContained=false property form. The CLI flag
            # "--self-contained false" gets overridden by the default implied by
            # -r win-x64, which silently bundles the entire runtime (~167 MB).
            - name: Publish single-file exe
              run: >
                  dotnet publish ColorPicker/ColorPicker.csproj
                  -c Release
                  -r win-x64
                  -p:SelfContained=false
                  -p:PublishSingleFile=true
                  -p:DebugType=none
                  -o publish

            # The single-file exe is shipped as-is, matching upstream's "portable" naming.
            - name: Name portable exe
              shell: pwsh
              run: Copy-Item "publish/ColorPickerMax.exe" "ColorPickerMaxPortable.exe"

            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup -y --no-progress

            # Compiles ColorPicker.Setup/Setup.iss, wrapping the published exe into a
            # proper Windows installer: wizard, start menu entry, license page,
            # optional desktop shortcut and an uninstaller.
            - name: Build installer
              shell: pwsh
              working-directory: ColorPicker.Setup
              run: |
                  $iscc = @(
                      "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                      "C:\Program Files\Inno Setup 6\ISCC.exe"
                  ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
                  Write-Host "Using ISCC: $iscc"
                  & $iscc Setup.iss "/DMyAppVersion=${{ steps.info.outputs.version }}" "/DMyAppFullVersion=${{ steps.info.outputs.version }}"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Collect installer
              shell: pwsh
              run: Copy-Item "ColorPicker.Setup/Output/ColorPickerMaxSetup.exe" "ColorPickerMaxSetup.exe"

            # Remove the previous rolling release so the new asset replaces it cleanly.
            # Fails silently on the very first run when nothing exists yet.
            - name: Remove previous rolling release
              continue-on-error: true
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release delete latest --yes --cleanup-tag

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: ColorPicker Max v${{ steps.info.outputs.full }}
                  body: |
                      Automated build of branch `main`.

                      - Base version: **${{ steps.info.outputs.version }}**
                      - Commit: `${{ steps.info.outputs.sha }}`
                      - Message: ${{ github.event.head_commit.message }}

                      Attachments:

                      - **ColorPickerMaxSetup.exe** - Windows installer (start menu entry + uninstaller)
                      - **ColorPickerMaxPortable.exe** - single-file portable exe, no install needed

                      Framework-dependent build (~9 MB).
                      Requires the **.NET 10 Desktop Runtime** to be installed.
                  files: |
                      ColorPickerMaxSetup.exe
                      ColorPickerMaxPortable.exe
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
